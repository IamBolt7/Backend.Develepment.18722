<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persistent Todo App — Docker Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <span class="eyebrow">LAB TEST-11 · DOCKER PERSISTENCE</span>
        <h1>Todo Archive. <span>Mounted to host volume.</span></h1>
        <p class="lead">Create, update, complete, and delete tasks stored in <code>docker-data/tasks.json</code> across container restarts.</p>
      </div>
      <div class="stats" aria-label="Task summary">
        <div class="stat"><strong id="statTotal">0</strong><span>Total</span></div>
        <div class="stat"><strong id="statPending">0</strong><span>Pending</span></div>
        <div class="stat"><strong id="statDone">0</strong><span>Completed</span></div>
      </div>
    </header>

    <section class="panel create-panel">
      <form id="createForm" class="create-form">
        <input id="titleInput" type="text" placeholder="Add a new task..." maxlength="140" required />
        <input id="categoryInput" type="text" placeholder="Category (e.g. Docker)" maxlength="40" />
        <input id="notesInput" type="text" placeholder="Optional note..." maxlength="400" />
        <button class="btn btn-primary" type="submit">Add Task</button>
      </form>
    </section>

    <section class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" data-status="all">All</button>
        <button class="tab" type="button" data-status="pending">Pending</button>
        <button class="tab" type="button" data-status="completed">Completed</button>
      </div>
      <input id="searchInput" class="search" type="search" placeholder="Filter tasks..." />
    </section>

    <section id="taskList" class="task-list" aria-live="polite"></section>

    <footer class="foot">
      <span>Data file: <code id="dataPathLabel">docker-data/tasks.json</code></span>
      <span>Made by <strong>Arnav Daftuar</strong></span>
    </footer>
  </main>

  <script>
    const state = { status: 'all', q: '' };
    const els = {
      list: document.getElementById('taskList'),
      form: document.getElementById('createForm'),
      title: document.getElementById('titleInput'),
      category: document.getElementById('categoryInput'),
      notes: document.getElementById('notesInput'),
      search: document.getElementById('searchInput'),
      total: document.getElementById('statTotal'),
      pending: document.getElementById('statPending'),
      done: document.getElementById('statDone'),
      dataPath: document.getElementById('dataPathLabel')
    };

    function esc(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadTasks() {
      const allRes = await fetch('/api/tasks');
      const allData = await allRes.json();
      els.total.textContent = allData.tasks.length;
      els.pending.textContent = allData.tasks.filter((t) => !t.completed).length;
      els.done.textContent = allData.tasks.filter((t) => t.completed).length;
      els.dataPath.textContent = allData.dataDir + '/tasks.json';

      const params = new URLSearchParams({ status: state.status, q: state.q });
      const res = await fetch('/api/tasks?' + params.toString());
      const data = await res.json();

      if (!data.tasks.length) {
        els.list.innerHTML = '<div class="empty">No matching tasks found.</div>';
        return;
      }

      els.list.innerHTML = data.tasks.map((t) => `
        <article class="task-card ${t.completed ? 'completed' : ''}" data-id="${esc(t.id)}">
          <div class="task-main">
            <div class="task-head">
              <span class="badge">${esc(t.category || 'General')}</span>
              <span class="status-text">${t.completed ? 'Completed' : 'Pending'}</span>
            </div>
            <h3>${esc(t.title)}</h3>
            ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ''}
          </div>
          <div class="task-actions">
            <button class="btn btn-secondary" type="button" data-action="toggle">${t.completed ? 'Mark Pending' : 'Complete'}</button>
            <button class="btn btn-secondary" type="button" data-action="edit">Edit</button>
            <button class="btn btn-ghost" type="button" data-action="delete">Delete</button>
          </div>
        </article>
      `).join('');
    }

    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = els.title.value.trim();
      if (!title) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          category: els.category.value.trim() || 'General',
          notes: els.notes.value.trim()
        })
      });
      els.form.reset();
      loadTasks();
    });

    els.list.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const card = btn.closest('.task-card');
      const id = card.dataset.id;
      const action = btn.dataset.action;

      if (action === 'toggle') {
        await fetch(`/api/tasks/${encodeURIComponent(id)}/toggle`, { method: 'PATCH' });
        loadTasks();
      } else if (action === 'edit') {
        const currentTitle = card.querySelector('h3').textContent;
        const currentNotes = card.querySelector('.notes')?.textContent || '';
        const nextTitle = prompt('Update task title:', currentTitle);
        if (nextTitle === null || !nextTitle.trim()) return;
        const nextNotes = prompt('Update task notes:', currentNotes);
        await fetch(`/api/tasks/${encodeURIComponent(id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: nextTitle.trim(),
            notes: nextNotes === null ? currentNotes : nextNotes.trim()
          })
        });
        loadTasks();
      } else if (action === 'delete') {
        await fetch(`/api/tasks/${encodeURIComponent(id)}`, { method: 'DELETE' });
        loadTasks();
      }
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        state.status = tab.dataset.status;
        loadTasks();
      });
    });

    els.search.addEventListener('input', (e) => {
      state.q = e.target.value;
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
