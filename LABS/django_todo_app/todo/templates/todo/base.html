{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django To-Do{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Backend Development · Django</p>
                <h1>My To-Do List</h1>
                <p class="subtitle">A simple database-backed task manager built with Django.</p>
            </div>
            <a class="button primary" href="{% url 'add_task' %}">+ Add Task</a>
        </header>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
