{% extends "todo/base.html" %}
{% block title %}Add Task · Django To-Do{% endblock %}
{% block content %}
<section class="card form-card">
    <div class="section-heading">
        <div>
            <h2>Add a New Task</h2>
            <p>Keep the title short and actionable.</p>
        </div>
    </div>

    <form method="post" class="task-form">
        {% csrf_token %}
        <label for="{{ form.title.id_for_label }}">Task title</label>
        {{ form.title }}
        {% if form.title.errors %}
            <div class="field-error">{{ form.title.errors|striptags }}</div>
        {% endif %}
        <div class="form-actions">
            <a class="button secondary" href="{% url 'task_list' %}">Cancel</a>
            <button class="button primary" type="submit">Add Task</button>
        </div>
    </form>
</section>
{% endblock %}
