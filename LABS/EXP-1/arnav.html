<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arnav | B.Tech CSE @ UPES</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top, #1f3b73 0%, transparent 45%),
        #0b1020;
      color: #eef3ff;
    }

    main {
      width: min(640px, 90vw);
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(12, 18, 38, 0.8);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    p {
      font-size: clamp(1.4rem, 3vw, 2rem);
      line-height: 1.4;
      font-weight: 600;
    }

    span {
      color: #8ec5ff;
    }
  </style>
</head>
<body>
  <main>
    <p>Hi I am <span>Arnav</span>, I am B.Tech CSE Student at UPES</p>
  </main>
</body>
</html>
