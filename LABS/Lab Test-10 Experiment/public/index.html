<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Test-10 – Real-time Chat (Socket.IO)</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.85);
      --panel-solid: #111827;
      --border: rgba(255, 255, 255, 0.1);
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --mine: linear-gradient(135deg, #4f46e5, #6366f1);
      --online: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.2), transparent 36%),
        radial-gradient(circle at 90% 90%, rgba(14, 165, 233, 0.16), transparent 38%),
        var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .container { display: flex; flex: 1; overflow: hidden; }

    #sidebar {
      width: 240px;
      background: rgba(15, 23, 42, 0.7);
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #sidebar h3 {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #userList { list-style: none; display: flex; flex-direction: column; gap: 6px; }

    #userList li {
      padding: 8px 10px;
      font-size: 0.9rem;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #userList li::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.65);
      flex-shrink: 0;
    }

    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      padding: 11px 15px;
      max-width: min(72%, 560px);
      align-self: flex-start;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .msg .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .msg .meta .name { color: #a5b4fc; font-weight: 700; }
    .msg .text { font-size: 0.95rem; line-height: 1.5; word-break: break-word; }

    .msg.mine {
      background: var(--mine);
      border-color: transparent;
      border-radius: 16px 16px 4px 16px;
      align-self: flex-end;
    }

    .msg.mine .meta { color: rgba(255, 255, 255, 0.78); }
    .msg.mine .meta .name { color: #ffffff; }

    .system-msg {
      align-self: center;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 4px 12px;
    }

    #inputArea {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
    }

    #msgInput {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    #msgInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    button {
      padding: 12px 20px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover { background: var(--accent-hover); transform: translateY(-1px); }

    #joinScreen {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 22, 0.86);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .joinBox {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      padding: 34px;
      border-radius: 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(380px, 100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .joinBox h2 { font-size: 1.5rem; letter-spacing: -0.02em; }
    .joinBox p { color: var(--muted); font-size: 0.9rem; }

    .joinBox input {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0b1020;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }

    .joinBox input:focus { border-color: var(--accent); }

    @media (max-width: 680px) {
      #sidebar { display: none; }
      header { padding: 12px 16px; }
      #messages { padding: 14px 16px; }
      #inputArea { padding: 10px 14px; }
    }
  </style>
</head>
<body>

<div id="joinScreen">
  <div class="joinBox">
    <span class="pill" style="align-self:center;">Socket.IO · Lab Test-10</span>
    <h2>Real-time Chat</h2>
    <p>Join the room to test live WebSocket messaging across browser tabs.</p>
    <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="20" onkeydown="if(event.key==='Enter') joinChat()">
    <button onclick="joinChat()">Join Chat</button>
  </div>
</div>

<header>
  <div class="brand">Real-time Chat</div>
  <span class="pill">Socket.IO Live</span>
</header>
<div class="container">
  <div id="sidebar">
    <h3>Online Users</h3>
    <ul id="userList"></ul>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myUsername = '';

  function joinChat() {
    const name = document.getElementById('usernameInput').value.trim();
    if (!name) return alert('Please enter a name');
    myUsername = name;
    socket.emit('join', myUsername);
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('msgInput').focus();
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg) return;
    socket.emit('message', msg);
    input.value = '';
  }

  socket.on('message', ({ username, message, time }) => {
    const div = document.createElement('div');
    div.className = 'msg' + (username === myUsername ? ' mine' : '');

    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = username;
    meta.appendChild(nameSpan);
    meta.appendChild(document.createTextNode(' · ' + time));

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = message;

    div.appendChild(meta);
    div.appendChild(text);
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  });

  socket.on('system', (msg) => {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = msg;
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  });

  socket.on('userList', (users) => {
    const list = document.getElementById('userList');
    list.innerHTML = '';
    users.forEach((u) => {
      const li = document.createElement('li');
      li.textContent = u;
      list.appendChild(li);
    });
  });
</script>
</body>
</html>
